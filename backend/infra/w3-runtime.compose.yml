name: epick-w3-core-runtime

x-w3-runtime: &w3-runtime
  image: ${W3_IMAGE:?set W3_IMAGE to an immutable W3 image reference}
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m
  volumes:
    - type: volume
      source: epick-w3-core-runtime-state
      target: /state
  restart: "no"

services:
  w3-core-init:
    <<: *w3-runtime
    command:
      - init
      - --db
      - /state/core.db
      - --retention-seconds
      - "1209600"
    profiles: ["w3-init"]

  w3-core-smoke:
    <<: *w3-runtime
    command: ["smoke", "--directory", "/tmp/smoke"]
    profiles: ["w3-smoke"]

  w3-core-inspect:
    <<: *w3-runtime
    command:
      - inspect
      - --db
      - /state/core.db
      - --retention-seconds
      - "1209600"
    profiles: ["w3-inspect"]

  w3-core-relay:
    <<: *w3-runtime
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      W3_CORE_DECISION_QUEUE_URL: ${W3_CORE_DECISION_QUEUE_URL:-}
      W3_CORE_DECISION_EXPECTED_ROLE_ID: ${W3_CORE_DECISION_EXPECTED_ROLE_ID:-}
    command:
      - relay-once
      - --db
      - /state/core.db
      - --retention-seconds
      - "1209600"
      - --authority
      - ${W3_AUTHORITY_FACTORY:-UNSET:factory}
      - --send
    profiles: ["w3-relay"]

  w3-core-lifecycle:
    <<: *w3-runtime
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      W3_CORE_DECISION_EXPECTED_ROLE_ID: ${W3_CORE_DECISION_EXPECTED_ROLE_ID:-}
      W3_LIFECYCLE_EXPECTED_W1_ROLE_ID: ${W3_LIFECYCLE_EXPECTED_W1_ROLE_ID:-}
      W3_LIFECYCLE_COMMAND_QUEUE_URL: ${W3_LIFECYCLE_COMMAND_QUEUE_URL:-}
      W3_LIFECYCLE_RECEIPT_QUEUE_URL: ${W3_LIFECYCLE_RECEIPT_QUEUE_URL:-}
    command:
      - lifecycle-once
      - --db
      - /state/core.db
      - --retention-seconds
      - "1209600"
      - --consume
    profiles: ["w3-lifecycle"]

  w3-core-expire:
    <<: *w3-runtime
    command:
      - expire
      - --db
      - /state/core.db
      - --retention-seconds
      - "1209600"
    profiles: ["w3-expire"]

  w3-core-backup:
    <<: *w3-runtime
    command:
      - backup
      - --db
      - /state/core.db
      - --retention-seconds
      - "1209600"
      - --destination
      - ${W3_BACKUP_DESTINATION:-/state/quarantine/manual.db}
    profiles: ["w3-backup"]

  w3-core-command:
    <<: *w3-runtime
    command:
      - inspect
      - --db
      - /state/core.db
      - --retention-seconds
      - "1209600"
    profiles: ["w3-command"]

volumes:
  epick-w3-core-runtime-state:
    name: epick-w3-core-runtime-state
    driver: local
