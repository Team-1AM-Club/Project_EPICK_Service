# This file intentionally contains no public API service. Public API deployment
# continues to use its API-only environment. Queue workers receive W1_RUNTIME_ENV_FILE;
# the protected lookup listener receives the narrower W1_LOOKUP_ENV_FILE instead.
#
# W1-only startup:
#   docker compose -f w1-runtime.compose.yml --profile w1-control up -d
#
# After W1 execution SQS and W2 command queue are configured:
#   docker compose -f w1-runtime.compose.yml --profile w1-execution up -d
#
# W2 result consumption is intentionally unavailable until W2 supplies the queue
# endpoint and its consumer/producer deployment is jointly prepared:
#   docker compose -f w1-runtime.compose.yml --profile w2-result up -d
#
# W3 Core Decision inbound uses a separate worker-only env file:
#   docker compose -f w1-runtime.compose.yml --profile w3-core-decision up -d
#
# W3 Authority is a distinct read-only private listener. Its host mapping is
# loopback-only and its env file contains only the dedicated DB login and workload auth:
#   docker compose -f w1-runtime.compose.yml --profile w3-authority up -d
# W3 retention uses two least-privilege W1 processes. The command relay env contains
# only the command queue/runtime DB values; the receipt env contains the receipt/DLQ,
# expected W3 stable Role ID, and deletion-only DB login:
#   docker compose -f w1-runtime.compose.yml --profile w3-retention up -d
#
# W4 Question Core inbound is opt-in and uses a separate worker-only env file.
# Do not start this profile until W4 has supplied its pinned producer, stable
# SenderId, and the isolated queue policy has passed W1 preflight:
#   docker compose -f w1-runtime.compose.yml --profile w4-question-core up -d
#
# W4's pre-send context check is a distinct private listener.  It has no host
# port: only a W4 container attached to this Compose network can reach it.
#   docker compose -f w1-runtime.compose.yml --profile w4-question-core-context up -d
#
# W2 staged-result and ACK ingress uses a separate worker-only env file.  It is
# deliberately not the legacy W2 result consumer profile:
#   docker compose -f w1-runtime.compose.yml --profile w2-commit-gate up -d
#
# M1 protected lookup startup. The port is loopback-only for host-local/SSM smoke;
# it is not a W2-reachable endpoint until the later private network binding is approved:
#   docker compose -f w1-runtime.compose.yml --profile w1-lookup up -d
#
# `RDS_CA_BUNDLE_PATH` is a host-only setting.  It must name the CA bundle on
# the Worker EC2 host (for staging: /opt/epick/certs/global-bundle.pem); it is
# never written into the worker env file or exposed to the public API.
services:
  w1-protected-lookup:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to the immutable backend image reference}
    env_file:
      - ${W1_LOOKUP_ENV_FILE:?set W1_LOOKUP_ENV_FILE to the lookup-only env file}
    command: ["python", "scripts/run_lookup_adapter.py"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ${RDS_CA_BUNDLE_PATH:?set RDS_CA_BUNDLE_PATH to the host RDS CA bundle}
        target: /run/epick/rds-ca.pem
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    profiles: ["w1-lookup"]

  w1-commit-gate-recovery:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE to the immutable backend image reference}
    env_file:
      - ${W1_RUNTIME_ENV_FILE:?set W1_RUNTIME_ENV_FILE to the worker-only env file}
    command: ["python", "scripts/run_w2_commit_gate_recovery_worker.py"]
    restart: unless-stopped
