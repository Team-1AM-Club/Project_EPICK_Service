[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "epick-service"
version = "0.1.0"
description = "EPICK job-application material selection service backend"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.19.2",
    "boto3>=1.42,<2",
    "fastapi[standard]>=0.141.1",
    "jsonschema>=4.23,<5",
    "pydantic-settings>=2.15.0",
    "psycopg[binary]>=3.3.5",
    "SQLAlchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "postgres: requires an isolated PostgreSQL test database",
    "w1_isolated_commit_gate: W1-owned commit-gate proof using isolated PostgreSQL and in-memory queue adapters",
    "w1_w2_commit_gate_e2e: requires W2 canonical ACK, private staging adapter, and a jointly provisioned E2E environment",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
