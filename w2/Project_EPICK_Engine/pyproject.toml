[build-system]
requires = [
    "setuptools>=75,<82",
    "wheel>=0.45,<1",
]
build-backend = "setuptools.build_meta"

[project]
name = "epick-engine"
version = "0.1.0"
description = "EPick hosted engine source-collection boundary"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "scrapy>=2.12,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
ct15 = [
    "boto3>=1.40,<2",
]
dev = [
    "build>=1.2,<2",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
    "setuptools>=75,<82",
    "wheel>=0.45,<1",
]

[project.scripts]
epick-w2-ct15 = "epick_engine.source_collection.commit_gate_operator:main"
epick-w2-source-runtime = "epick_engine.source_collection.source_runtime_operator:main"
epick-w2-w3-recover = "epick_engine.source_collection.w3_recovery_operator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "approved_postgres: requires an explicitly approved isolated PostgreSQL DSN",
    "external_integration: requires explicitly supplied W1, W3, queue, or site infrastructure",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["epick_engine"]
mypy_path = "src"
warn_unreachable = true
