name: W3 validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked ruff format --check src tests scripts
      - run: uv run --locked python scripts/export_restriction_contract.py --check
      - run: uv run --locked python scripts/export_c01_contract.py --check
      - run: uv run --locked python scripts/export_core_decision_contract.py --check
      - run: uv run --locked pytest -q
      - run: uv run --locked python scripts/restriction_smoke.py --output-dir .runtime/ci-smoke
      - run: uv run --locked python scripts/c01_smoke.py --output-dir .runtime/c01-ci-smoke
      - run: uv run --locked python -m w3_knowledge.core_runtime_cli smoke --directory .runtime/core-relay-ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w3-restriction-smoke-result
          path: |
            .runtime/ci-smoke/result.json
            .runtime/c01-ci-smoke/result.json
            .runtime/core-relay-ci-smoke/result.json
