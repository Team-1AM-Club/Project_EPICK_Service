name: Backend CI

on:
  push:
    branches:
      - "feat/**"
      - develop
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - develop
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: epick
          POSTGRES_PASSWORD: epick
          POSTGRES_DB: epick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U epick -d epick_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://epick:epick@localhost:5432/epick_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --group dev

      - name: Check code
        run: python -m ruff check app tests

      - name: Run tests
        run: python -m pytest -q
